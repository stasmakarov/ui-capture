plugins {
    id 'io.jmix' version '2.8.6'
    id 'java'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'com.vaadin'

jmix {
    bomVersion = '2.8.6'
    projectId = 'uic'
}

group = 'io.uitrainer'
version = '0.6.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://global.repo.jmix.io/repository/public'
    }
}

dependencies {
    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'io.jmix.security:jmix-security-starter'
    implementation 'io.jmix.security:jmix-security-flowui-starter'
    implementation 'io.jmix.security:jmix-security-data-starter'
    implementation 'io.jmix.localfs:jmix-localfs-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-data-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'
    implementation 'io.jmix.flowui:jmix-flowui-kit'
    implementation 'io.jmix.datatools:jmix-datatools-starter'
    implementation 'io.jmix.datatools:jmix-datatools-flowui-starter'
    implementation 'io.jmix.translations:jmix-translations-ru'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.vaadin:vaadin-dev'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.jmix.flowui:jmix-flowui-test-assist'
}

configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
    exclude group: 'com.vaadin', module: 'copilot'
}

vaadin {
    optimizeBundle = false
}

tasks.withType(org.springframework.boot.gradle.tasks.buildinfo.BuildInfo).configureEach {
    properties {
        additional.put('jmixVersion', jmix.bomVersion)
    }
}

def gitRoot = rootProject.projectDir.parentFile
def generatedGitDir = layout.buildDirectory.dir('generated/git-properties')

tasks.register('generateGitProperties') {
    def out = generatedGitDir.map { it.file('git.properties') }
    outputs.file(out)
    doLast {
        def runGit = { String... args ->
            try {
                def process = new ProcessBuilder(['git', *args])
                        .directory(gitRoot)
                        .redirectError(ProcessBuilder.Redirect.DISCARD)
                        .start()
                def text = process.inputStream.getText('UTF-8').trim()
                process.waitFor()
                return process.exitValue() == 0 ? text : ''
            } catch (IOException ignored) {
                return ''
            }
        }
        def branch = System.getenv('GIT_BRANCH') ?: runGit('rev-parse', '--abbrev-ref', 'HEAD')
        if (branch == 'HEAD') {
            branch = System.getenv('GIT_BRANCH') ?: 'detached'
        }
        def commit = System.getenv('GIT_COMMIT') ?: runGit('rev-parse', '--short', 'HEAD')
        def time = System.getenv('GIT_COMMIT_TIME') ?: runGit('log', '-1', '--format=%cI')
        def lines = []
        if (branch) {
            lines << "git.branch=${branch}"
        }
        if (commit) {
            lines << "git.commit.id.abbrev=${commit}"
        }
        if (time) {
            lines << "git.commit.time=${time}"
        }
        def file = out.get().asFile
        file.parentFile.mkdirs()
        file.write(lines ? lines.join('\n') + '\n' : '', 'UTF-8')
    }
}

sourceSets {
    main {
        resources {
            srcDir generatedGitDir
        }
    }
}

tasks.named('processResources') {
    dependsOn 'generateGitProperties'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.register('deployProd', Exec) {
    group = 'deploy'
    description = 'Собрать production bootJar и задеплоить на Ubuntu по SSH (scripts/build-prod-jar.sh)'
    workingDir = rootProject.projectDir.parentFile
    commandLine 'bash', 'scripts/build-prod-jar.sh'
}

tasks.register('buildProdJar', Exec) {
    group = 'deploy'
    description = 'Собрать production bootJar без выкладки (--skip-deploy)'
    workingDir = rootProject.projectDir.parentFile
    commandLine 'bash', 'scripts/build-prod-jar.sh', '--skip-deploy'
}
