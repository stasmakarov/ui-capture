# База: docker compose up -d (корень репозитория) поднимает PostgreSQL 16 на localhost:5432.
# stringtype=unspecified — чтобы строки из JPA записывались в колонки JSONB (lesson.json, manifest.json).
main.datasource.url=${UIC_DB_URL:jdbc:postgresql://localhost:5432/uicapture?stringtype=unspecified}
main.datasource.username=${UIC_DB_USER:uicapture}
main.datasource.password=${UIC_DB_PASSWORD:uicapture}

main.liquibase.change-log=io/uicapture/platform/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=io/uicapture/platform/menu.xml
jmix.ui.composite-menu=false
jmix.core.available-locales=ru
jmix.core.default-locale=ru

# Файлы пакетов уроков (Jmix FileStorage, локальный диск)
jmix.localfs.storage-dir=${UIC_FILES_DIR:.jmix/files}

server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

# Публичный адрес сервера для ссылки uicapture://new?server=…; пусто — берётся из запроса.
uicapture.public-url=${UIC_PUBLIC_URL:}
uicapture.studio.local-url=http://127.0.0.1:44731
uicapture.studio.ticket-ttl=PT5M
uicapture.studio.exchanged-token-ttl=P90D

vaadin.launch-browser=false
logging.level.org.atmosphere=warn
logging.level.eclipselink.logging.sql=info
logging.level.io.jmix.core.datastore=info
logging.level.io.jmix.core.AccessLogger=info
logging.level.io.jmix=info
logging.level.liquibase=warn
