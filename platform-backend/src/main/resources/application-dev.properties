# Профиль dev: демо-пользователи (пароль = логин) и демо-курс создаются при старте.
ui.login.defaultUsername=trainer
ui.login.defaultPassword=trainer

# Admin PostgreSQL для автосоздания роли/БД до DataSource и Liquibase
# (EnvironmentPostProcessor). Переопределение через env:
# UICAPTURE_DEV_DBADMIN_URL / UICAPTURE_DEV_DBADMIN_USERNAME / UICAPTURE_DEV_DBADMIN_PASSWORD
# или UICAPTURE_DEV_DB_ADMIN_URL и т.п. (relaxed binding).
uicapture.dev.db-admin.url=jdbc:postgresql://localhost:5432/postgres
uicapture.dev.db-admin.username=jmix
uicapture.dev.db-admin.password=jmix
