# Профиль dev: демо-пользователи (пароль = логин) и демо-курс создаются при старте.
ui.login.defaultUsername=trainer
ui.login.defaultPassword=trainer

# Admin PostgreSQL для автосоздания роли/БД до DataSource и Liquibase
# (EnvironmentPostProcessor). Новые имена: UITRAINER_DEV_DBADMIN_URL / _USERNAME / _PASSWORD.
# Запасные: UICAPTURE_DEV_DBADMIN_* и свойство uicapture.dev.db-admin.* (relaxed binding).
uitrainer.dev.db-admin.url=${UITRAINER_DEV_DBADMIN_URL:${UICAPTURE_DEV_DBADMIN_URL:${uicapture.dev.db-admin.url:jdbc:postgresql://localhost:5432/postgres}}}
uitrainer.dev.db-admin.username=${UITRAINER_DEV_DBADMIN_USERNAME:${UICAPTURE_DEV_DBADMIN_USERNAME:${uicapture.dev.db-admin.username:jmix}}}
uitrainer.dev.db-admin.password=${UITRAINER_DEV_DBADMIN_PASSWORD:${UICAPTURE_DEV_DBADMIN_PASSWORD:${uicapture.dev.db-admin.password:jmix}}}
