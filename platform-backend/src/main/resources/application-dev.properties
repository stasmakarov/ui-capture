# Профиль dev: демо-пользователи (пароль = логин) и демо-курс создаются при старте.
ui.login.defaultUsername=trainer
ui.login.defaultPassword=trainer

# Admin PostgreSQL для автосоздания роли/БД до DataSource и Liquibase
# (EnvironmentPostProcessor). Env: UITRAINER_DEV_DBADMIN_URL / _USERNAME / _PASSWORD.
uitrainer.dev.db-admin.url=${UITRAINER_DEV_DBADMIN_URL:jdbc:postgresql://localhost:5432/postgres}
uitrainer.dev.db-admin.username=${UITRAINER_DEV_DBADMIN_USERNAME:jmix}
uitrainer.dev.db-admin.password=${UITRAINER_DEV_DBADMIN_PASSWORD:jmix}

logging.level.eclipselink.logging.sql=info
logging.level.io.jmix.core.datastore=info
logging.level.io.jmix.core.AccessLogger=info
logging.level.io.jmix=info
