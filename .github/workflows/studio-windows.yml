name: studio-windows
on:
  push:
    tags: ['studio-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:template
      - run: npm run build:inpage
      - run: npm test
      - name: Smoke packHtml
        run: npx tsx tools/pack/smoke.ts
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#studio-v}
          PKG=$(node -p "require('./desktop/package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "Тег studio-v$VERSION не совпадает с version в desktop/package.json ($PKG)"
            exit 1
          fi
      - run: npm run build --workspace @uitrainer/desktop
      - name: electron-builder
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          UITRAINER_UPDATE_URL: ${{ vars.UITRAINER_PLATFORM_URL }}/api/studio/releases/win
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke inpage in win-unpacked
        shell: bash
        run: |
          test -f desktop/release/win-unpacked/resources/inpage.js
          ELECTRON_RUN_AS_NODE=1 "desktop/release/win-unpacked/uitrainer Studio.exe" "$GITHUB_WORKSPACE/desktop/scripts/smoke-inpage.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: uitrainer-studio-windows
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
