# Локальная база платформы (PostgreSQL 16). Бэкенд platform-backend/ подключается к ней: ./gradlew bootRun.
# Имя БД, роль и volume остаются uicapture: существующий volume не переименовывается.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: uicapture
      POSTGRES_PASSWORD: uicapture
      POSTGRES_DB: uicapture
    ports:
      - "5432:5432"
    volumes:
      - uicapture-pg:/var/lib/postgresql/data

volumes:
  uicapture-pg:
