# Локальная база платформы (PostgreSQL 16). Бэкенд platform-backend/ подключается к ней: ./gradlew bootRun.
# Роль jmix/jmix. Имя БД и volume остаются uicapture (volume не переименовывается; роль в уже созданном volume не меняется).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jmix
      POSTGRES_PASSWORD: jmix
      POSTGRES_DB: uicapture
    ports:
      - "5432:5432"
    volumes:
      - uicapture-pg:/var/lib/postgresql/data

volumes:
  uicapture-pg:
